name: Temporary Phase 1 Preclass Launch Verification

on:
  push:
    branches:
      - audit/phase1-preclass-launch-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify current teacher workflow language
        run: |
          set -euo pipefail
          DOC='docs/jabberwocky-phase-1-teacher-launch-guide.md'
          PAGE='src/pages/courses/grade-7-science/jabberwocky/phase-1/teacher-launch-guide/index.astro'
          grep -q 'Do \*\*not\*\* pre-create Team IDs' "$DOC"
          grep -q 'Team Setup comes first' "$PAGE"
          grep -q 'Team Directory' "$DOC"
          grep -q 'Team Recovery' "$DOC"
          grep -q '25-Period Plan' "$PAGE"
          ! grep -q 'Have continent assignments and Team IDs ready' "$DOC"
          ! grep -q 'Prepare student → continent → Team ID roster' "$PAGE"
          ! grep -q 'Open the JCEC Submission Portal once' "$DOC"
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
