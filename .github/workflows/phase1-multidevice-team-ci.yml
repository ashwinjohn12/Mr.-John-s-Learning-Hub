name: Temporary Phase 1 Multi-Device Team Verification

on:
  push:
    branches:
      - fix/phase1-multidevice-team-identity-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify multi-device team identity flow
        run: |
          set -euo pipefail
          grep -q "Create New Team" src/components/JcecPhase1TeamSetup.astro
          grep -q "Load / Join Existing Team" src/components/JcecPhase1TeamSetup.astro
          grep -q "current?.teamId || uuid()" src/components/JcecPhase1TeamSetup.astro
          grep -q "Copy Team Join Code" src/components/JcecPhase1TeamSetup.astro
          grep -q "JCEC1:" src/components/JcecPhase1TeamSetup.astro
          grep -q "Load Team Join Code" src/pages/courses/grade-7-science/jabberwocky/phase-1/team-recovery/index.astro
          grep -q "same Team ID as the rest of the team" src/pages/courses/grade-7-science/jabberwocky/phase-1/team-recovery/index.astro
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
