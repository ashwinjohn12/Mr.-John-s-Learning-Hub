name: Temporary Phase 1 Mission 2 Lab Readiness

on:
  push:
    branches:
      - fix/phase1-mission2-lab-readiness-20260922
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Mission 2 lab logistics and species mapping
        run: |
          set -euo pipefail
          PAGE=src/pages/courses/grade-7-science/jabberwocky/phase-1/mission-2/index.astro
          DATA=src/data/jabberwockyOperation03.ts
          GUIDE=src/pages/courses/grade-7-science/jabberwocky/phase-1/teacher-launch-guide/index.astro
          DOC=docs/jabberwocky-phase-1-teacher-launch-guide.md
          MATERIALS=docs/jabberwocky-phase1-final-materials-plan.md
          grep -q "36 identical plastic counters" "$PAGE"
          grep -q "20 seconds" "$PAGE"
          grep -q "6-well egg carton" "$PAGE"
          grep -q "collection cup" "$PAGE"
          grep -q "What the tools model" "$PAGE"
          grep -q "slice(0, 4)" "$PAGE"
          grep -q "No separate reconstruction sheet" "$GUIDE"
          grep -q "Continent → native species" "$GUIDE"
          grep -q "45 min" "$GUIDE"
          grep -q "36 identical plastic counters" "$DOC"
          grep -q "36 identical plastic counters" "$MATERIALS"
          for pair in             "gyre:Ridgeback Grazer"             "brillig:Canopy Glider"             "manxome:Tide Skipper"             "slithy-toves:Dune Runner"             "wabe:Snow Burrower"             "bandersnatch:Plains Strider"             "gimble:Barkclimber"             "mimsy:Reedcrawler"; do
              id="${pair%%:*}"
              species="${pair#*:}"
              grep -q "id: '${id}'" "$DATA"
              grep -q "fieldName: '${species}'" "$DATA"
          done
          node - <<'NODE'
          const fs = require('fs');
          const data = fs.readFileSync('src/data/jabberwockyOperation03.ts','utf8');
          const blocks = [...data.matchAll(/id: '([^']+)'[\s\S]*?fieldName: '([^']+)'[\s\S]*?clues: \[([\s\S]*?)\n    \],/g)];
          if (blocks.length !== 8) throw new Error('Expected 8 species blocks, found ' + blocks.length);
          for (const [,id,name,clues] of blocks) {
            const count = (clues.match(/source:/g) || []).length;
            if (count < 4) throw new Error(id + ' / ' + name + ' has fewer than four approved clues: ' + count);
          }
          const page = fs.readFileSync('src/pages/courses/grade-7-science/jabberwocky/phase-1/mission-2/index.astro','utf8');
          const pages = (page.match(/<section class="print-page">/g) || []).length;
          if (pages !== 2) throw new Error('Mission 2 printable must remain exactly two pages; found ' + pages);
          NODE
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
