name: Temporary SURVIVE Authentic Visual Audit
on:
  push:
    branches:
      - fix/grade9-mars-survive-authentic-visuals-20260924
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Learning Hub build
        run: npm run build
      - name: Browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/survive-preview.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4321/Mr.-John-s-Learning-Hub/courses/grade-9-science/space-exploration/mars-readiness/survive/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/survive-preview.log
          exit 1
      - name: Audit
        run: node scripts/temp-audit-survive-authentic-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survive-authentic-visual-audit
          path: artifacts/survive-authentic-visuals
          retention-days: 7
