name: Temporary OPERATE Authentic Visual Audit
on:
  push:
    branches: [fix/grade9-mars-operate-authentic-visuals-20260924]
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/op.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4321/Mr.-John-s-Learning-Hub/courses/grade-9-science/space-exploration/mars-readiness/operate/ >/dev/null && exit 0; sleep 1; done; cat /tmp/op.log; exit 1
      - run: node scripts/temp-audit-operate-authentic-visuals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: operate-authentic-visual-audit, path: artifacts/operate-authentic-visuals, retention-days: 7 }
