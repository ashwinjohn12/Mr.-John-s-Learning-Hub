name: Grade 9 Mars Prototype CI

on:
  push:
    branches:
      - dev/grade9-space-mars-understand-prototype-20260920
      - fix/grade9-mars-op05-06-student-scaffolds-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Targeted revision scope
        run: node -e "console.log('Intentional Operations 05-06 student-understanding revision; full build/browser gate follows.')"

      - name: Build entire Learning Hub
        run: npm run build

      - name: Install browser audit runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start branch-local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/mars-preview.log 2>&1 &
          echo $! > /tmp/mars-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/Mr.-John-s-Learning-Hub/courses/grade-9-science/space-exploration/mars-readiness/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mars-preview.log
          exit 1

      - name: Run responsive and interaction audit
        run: node scripts/audit-grade9-mars-browser.mjs

      - name: Upload audit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade9-mars-prototype-audit
          path: artifacts/mars-prototype
          retention-days: 14
