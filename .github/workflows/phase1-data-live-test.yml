name: Temporary Phase 1 Data Live Test

on:
  push:
    branches:
      - feat/phase1-data-collection-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data

      - name: Full production build
        run: npm run build

      - name: Verify endpoint health and submit temporary team
        shell: bash
        env:
          ENDPOINT: https://script.google.com/macros/s/AKfycbwPc510wfFhtm9IIEVWZloWC_C1QVBMfa1rksk7vLv-cbZlhVkCbE_-HUH4IQybqkfQLg/exec
        run: |
          set -euo pipefail
          echo 'Health:'
          curl --fail --location --silent --show-error "$ENDPOINT"
          echo

          post() {
            local payload="$1"
            curl --fail --location --silent --show-error \
              --request POST \
              --header 'Content-Type: application/x-www-form-urlencoded;charset=UTF-8' \
              --data-urlencode "payload=${payload}" \
              "$ENDPOINT"
            echo
          }

          TEAM='LIVE-TEST-20260916'
          MEMBERS='[{"name":"Ava Smith","role":"Lead Scientist"},{"name":"Noah Brown","role":"Evidence Recorder"},{"name":"Mia Chen","role":"Data Analyst"}]'

          post '{"eventId":"LIVE-EVENT-PROFILE-001","phase":1,"eventType":"team_profile","mission":"","recordTitle":"Team Profile","record":{"purpose":"live verification"},"team":{"teamId":"'"$TEAM"'","teamName":"Endpoint Test Team","logo":"🔬","missionStatement":"Temporary verification only","members":'"$MEMBERS"'},"continent":"","clientUpdatedAt":"2026-09-16T03:00:00.000Z","sourceVersion":"phase1-live-test"}'

          # Exact duplicate Event ID should be accepted as duplicate without a second Intake row.
          post '{"eventId":"LIVE-EVENT-PROFILE-001","phase":1,"eventType":"team_profile","mission":"","recordTitle":"Team Profile","record":{"purpose":"duplicate verification"},"team":{"teamId":"'"$TEAM"'","teamName":"Endpoint Test Team","logo":"🔬","missionStatement":"Temporary verification only","members":'"$MEMBERS"'},"continent":"","clientUpdatedAt":"2026-09-16T03:00:01.000Z","sourceVersion":"phase1-live-test"}'

          post '{"eventId":"LIVE-EVENT-CONTINENT-001","phase":1,"eventType":"continent","mission":"","recordTitle":"Assigned Continent","record":{"continent":"gyre"},"team":{"teamId":"'"$TEAM"'","teamName":"Endpoint Test Team","logo":"🔬","missionStatement":"Temporary verification only","members":'"$MEMBERS"'},"continent":"gyre","clientUpdatedAt":"2026-09-16T03:00:02.000Z","sourceVersion":"phase1-live-test"}'

          for mission in 1 2 3 4 5; do
            case "$mission" in
              1) title='Environment Profile' ;;
              2) title='Native Species Card' ;;
              3) title='Ecosystem Map' ;;
              4) title='Ecosystem Change Record' ;;
              5) title='JCEC Recommendation Board' ;;
            esac
            post '{"eventId":"LIVE-EVENT-MISSION-'"$mission"'-001","phase":1,"eventType":"mission_record","mission":'"$mission"',"recordTitle":"'"$title"'","record":{"test":"mission-'"$mission"'"},"team":{"teamId":"'"$TEAM"'","teamName":"Endpoint Test Team","logo":"🔬","missionStatement":"Temporary verification only","members":'"$MEMBERS"'},"continent":"gyre","clientUpdatedAt":"2026-09-16T03:00:0'"$mission"'.000Z","sourceVersion":"phase1-live-test"}'
          done
