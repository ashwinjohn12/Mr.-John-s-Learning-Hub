name: Whole-Year Classroom Readiness CI

on:
  push:
    branches:
      - audit/whole-year-classroom-readiness-20260914

permissions:
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /Mr.-John-s-Learning-Hub/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production artifact
        uses: withastro/action@v3
        with:
          node-version: 20
          path: .
