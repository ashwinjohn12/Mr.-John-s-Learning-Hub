name: FutureTech Lab CI

on:
  push:
    branches:
      - 'dev/futuretech-lab-*'
  pull_request:
    paths:
      - 'src/pages/index.astro'
      - 'src/pages/courses/futuretech-lab/**'
      - 'src/components/FutureTechMissionFrame.astro'
      - 'scripts/audit-futuretech-lab.mjs'
      - '.github/workflows/futuretech-lab-ci.yml'

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/audit-futuretech-lab.mjs
