name: Temporary Phase 1 Final Materials Verification

on:
  push:
    branches:
      - fix/phase1-final-materials-audit-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify final materials plan
        run: |
          set -euo pipefail
          grep -q "Ongoing total: 6 consumable sheets per team" docs/jabberwocky-phase1-final-materials-plan.md
          grep -q "Do not print a separate reconstruction sheet" docs/jabberwocky-phase1-final-materials-plan.md
          grep -q "No separate reconstruction sheet is needed" docs/jabberwocky-phase-1-teacher-launch-guide.md
          grep -q "no required per-student Mission 1–5 packets" docs/jabberwocky-phase-1-teacher-launch-guide.md
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
