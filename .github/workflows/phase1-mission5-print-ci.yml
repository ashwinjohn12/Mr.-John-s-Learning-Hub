name: Temporary Mission 5 Print Verification

on:
  push:
    branches:
      - fix/phase1-mission5-printables-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Mission 5 print wiring
        run: |
          set -euo pipefail
          grep -q "JcecMission5PrintFix" src/layouts/BaseLayout.astro
          grep -q "body.print-mission5-board" src/components/JcecMission5PrintFix.astro
          grep -q "mission5-zone-path" src/components/JcecMission5PrintFix.astro
          grep -q "min-height: 1.18in" src/components/JcecMission5PrintFix.astro
          grep -q "min-height: 0.78in" src/components/JcecMission5PrintFix.astro
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
