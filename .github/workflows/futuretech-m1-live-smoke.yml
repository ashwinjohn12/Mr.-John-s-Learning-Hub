name: FutureTech Mission 1 Live Smoke

on:
  push:
    branches:
      - 'test/futuretech-m1-live-smoke-20260929'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-futuretech-m1-live.mjs
