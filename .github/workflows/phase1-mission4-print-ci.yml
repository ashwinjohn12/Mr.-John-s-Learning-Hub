name: Temporary Mission 4 Print Verification

on:
  push:
    branches:
      - fix/phase1-mission4-printables-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Mission 4 print wiring
        run: |
          set -euo pipefail
          grep -q "JcecMission4PrintFix" src/layouts/BaseLayout.astro
          grep -q "body.print-mission4-packet" src/components/JcecMission4PrintFix.astro
          grep -q "width: 5.75in" src/components/JcecMission4PrintFix.astro
          grep -q "height: 0.58in" src/components/JcecMission4PrintFix.astro
          grep -q "height: 1.45in" src/components/JcecMission4PrintFix.astro
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
