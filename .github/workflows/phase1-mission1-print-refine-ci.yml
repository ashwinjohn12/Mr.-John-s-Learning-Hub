name: Temporary Mission 1 Print Refinement Verification

on:
  push:
    branches:
      - refine/phase1-mission1-field-sheet-20260916
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify refined print layout
        run: |
          set -euo pipefail
          grep -q "height: 0.72in" src/components/JcecMission1PrintFix.astro
          grep -q "height: 0.5in" src/components/JcecMission1PrintFix.astro
          grep -q "text-align: center" src/components/JcecMission1PrintFix.astro
          grep -q "table-layout: fixed" src/components/JcecMission1PrintFix.astro
      - name: Phase 1 readiness audit
        run: npm run audit:jabberwocky-phase1
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
