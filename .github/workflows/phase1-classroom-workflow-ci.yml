name: Temporary Phase 1 Classroom Workflow Verification

on:
  push:
    branches:
      - audit/phase1-classroom-data-workflow-20260916-final2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify recovery page scope and safeguards
        run: |
          set -euo pipefail
          FILE='src/pages/courses/grade-7-science/jabberwocky/phase-1/team-recovery/index.astro'
          test -f "$FILE"
          grep -Fq "TEACHER-DIRECTED TOOL" "$FILE"
          grep -Fq "jabberwocky-phase1-team-profile" "$FILE"
          grep -Fq "jabberwocky-phase1-posting" "$FILE"
          grep -Fq "Existing Team ID" "$FILE"
          grep -Fq "Use first names only" "$FILE"
          grep -Fq "3–5 members" "$FILE"
          grep -Fq "does <em>not</em> copy old local work" "$FILE"
          grep -Fq "Original team logo" "$FILE"
      - name: Phase 1 data audit
        run: npm run audit:jabberwocky-phase1-data
      - name: Full production build
        run: npm run build
